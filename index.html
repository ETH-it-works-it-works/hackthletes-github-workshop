<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <title>Voice To-Do List</title>
    <script src="./profileCard.js"></script>
  </head>
  <body>
    <div class="page">
      <h1 class="poppins-extrabold">Zero To Hero Workshop</h1>
      <div class="container" id="profiles"></div>
    </div>
    <div class="github-link">
      <a href="https://github.com/Seann2003/hackthletes-github-workshop" target="_blank">Link to GitHub: https://github.com/Seann2003/hackthletes-github-workshop</a>
    </div>
  </body>
  <script>
    const profiles = [
      {
        name: "Sean Hoe",
        role: "Blockchain Developer/Full Stack Developer",
        image: "images/boy-profile.png",
        hobby: "Playing Valorant",
      },
      {
        name: "Jane Doe",
        role: "UI/UX Designer",
        image: "images/girl-profile.png",
        hobby: "Drawing",
      },
      {
        name: "Sean Hoe",
        role: "Blockchain Developer/Full Stack Developer",
        image: "images/boy-profile.png",
        hobby: "Playing Valorant",
      },
      {
        name: "Jane Doe",
        role: "UI/UX Designer",
        image: "images/girl-profile.png",
        hobby: "Drawing",
      },{
        name: "Sean Hoe",
        role: "Blockchain Developer/Full Stack Developer",
        image: "images/boy-profile.png",
        hobby: "Playing Valorant",
      },
      {
        name: "Jane Doe",
        role: "UI/UX Designer",
        image: "images/girl-profile.png",
        hobby: "Drawing",
      },
    ];
    const profileContainer = document.getElementById("profiles");
    profiles.forEach((profile) => {
      const profileCard = document.createElement("profile-card");
      profileCard.setAttribute("name", profile.name);
      profileCard.setAttribute("role", profile.role);
      profileCard.setAttribute("image", profile.image);
      profileCard.setAttribute("hobby", profile.hobby);
      profileContainer.appendChild(profileCard);
    });
  </script>
</html>
