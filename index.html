        display: flex;

        background: #f0f0f0;
        margin: 0;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 300px;
      }
      button {
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #e0e0e0;
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
        display: flex;
        justify-content: space-between;
      }
      .delete {
        background: red;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 3px;
        padding: 5px;
      }
